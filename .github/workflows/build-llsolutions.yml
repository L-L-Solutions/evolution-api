name: Build L&L Solutions image

on:
  push:
    branches:
      - fix/chatwoot-group-participant
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/l-l-solutions/evolution-api:2.3.7-ll.1
            ghcr.io/l-l-solutions/evolution-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
